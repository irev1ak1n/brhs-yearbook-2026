<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports | BRHS Yearbook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/core/global.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/pages/sports.css">

    <link rel="stylesheet" href="../assets/css/components/footer.css">
    <link rel="stylesheet" href="../assets/css/components/navbar.css">
    <link rel="stylesheet" href="../assets/css/components/mobile-navbar.css">

    <link rel="shortcut icon" href="../assets/images/logo/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/logo/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/logo/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/logo/apple-touch-icon.png">
    <link rel="manifest" href="../assets/images/logo/site.webmanifest">
</head>

<body>

<div id="navbar-placeholder"></div>

<main>

    <section class="yb-sports-page">

        <!-- HOME VIEW -->

        <div class="yb-sports-home" id="sportsHome">

            <div class="yb-sports-hero">

                <p class="yb-sports-kicker">BRHS ATHLETICS</p>

                <h1>Sports Moments</h1>

                <p class="yb-sports-subtitle">
                    Explore game days, team highlights, and the moments
                    that made this year unforgettable.
                </p>

            </div>

            <div class="yb-sports-grid">

                <button class="yb-sport-card" data-sport="football">

                    <img
                            src="../assets/images/gallery/football/football.jpg"
                            alt="Football"
                    >

                    <span>Football</span>

                </button>

                <button class="yb-sport-card" data-sport="baseball">

                    <img
                            src="../assets/images/sports/baseball/baseball-1.jpg"
                            alt="Baseball"
                    >

                    <span>Baseball</span>

                </button>

                <button class="yb-sport-card" data-sport="basketball">

                    <img
                            src="../assets/images/sports/basketball/basketball-1.jpg"
                            alt="Basketball"
                    >

                    <span>Basketball</span>

                </button>

            </div>

        </div>

        <!-- SPORT VIEW -->

        <div class="yb-sport-view" id="sportView" hidden>

            <button class="yb-back-btn" id="backToSports">
                ← Back to Sports
            </button>

            <div class="yb-sport-view-header">

                <p class="yb-sports-kicker">BRHS ATHLETICS</p>

                <h1 id="sportTitle">Football</h1>

            </div>

            <div class="yb-sports-gallery" id="sportsGallery"></div>

        </div>

    </section>

</main>

<!--<div id="footer-host"></div>-->

<script src="../assets/js/components/navbar.js"></script>
<script src="../assets/js/components/footer.js"></script>

<script src="../assets/js/pages/sports.js"></script>

<script src="../assets/js/layout.js"></script>

</body>
</html>
